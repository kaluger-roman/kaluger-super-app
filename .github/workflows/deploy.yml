name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'

      - name: Build backend
        run: cd backend && npm ci && npx prisma generate && npm run build

      - name: Deploy frontend build
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: frontend/build/
          remote_path: /home/roman-kaluger/kaluger-super-app/frontend/build/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy backend build
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: backend/dist/
          remote_path: /home/roman-kaluger/kaluger-super-app/backend/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy prisma schema & package files
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: backend/prisma/
          remote_path: /home/roman-kaluger/kaluger-super-app/backend/prisma/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy package files
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: backend/package.json
          remote_path: /home/roman-kaluger/kaluger-super-app/backend/package.json
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy package-lock
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: backend/package-lock.json
          remote_path: /home/roman-kaluger/kaluger-super-app/backend/package-lock.json
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install deps, migrate & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/roman-kaluger/kaluger-super-app/backend
            npm ci --omit=dev
            npx prisma migrate deploy
            pm2 restart backend || pm2 start dist/index.js --name backend --max-memory-restart 300M
