name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'

      - name: Build backend
        run: cd backend && npm ci && npx prisma generate && npm run build

      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Setup SSH config
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking no\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Test SSH
        run: ssh vps "echo SSH_OK"

      - name: Deploy frontend
        run: rsync -avz --delete frontend/build/ vps:/home/roman-kaluger/kaluger-super-app/frontend/build/

      - name: Deploy backend
        run: |
          rsync -avz --delete backend/dist/ vps:/home/roman-kaluger/kaluger-super-app/backend/dist/
          rsync -avz backend/prisma/ vps:/home/roman-kaluger/kaluger-super-app/backend/prisma/
          rsync -avz backend/package.json backend/package-lock.json vps:/home/roman-kaluger/kaluger-super-app/backend/

      - name: Install deps, migrate & restart
        run: |
          ssh vps << 'EOF'
            cd /home/roman-kaluger/kaluger-super-app/backend
            npm ci --omit=dev
            npx prisma migrate deploy
            node dist/scripts/syncNews.js
            pm2 restart backend || pm2 start dist/index.js --name backend --max-memory-restart 300M
          EOF
