name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug SSH key
        run: |
          echo "Key length: $(echo '${{ secrets.VPS_SSH_KEY }}' | wc -c)"
          echo "Key first line: $(echo '${{ secrets.VPS_SSH_KEY }}' | head -1)"
          echo "Key last line: $(echo '${{ secrets.VPS_SSH_KEY }}' | tail -1)"
          echo "Key line count: $(echo '${{ secrets.VPS_SSH_KEY }}' | wc -l)"
          echo "Host: '${{ secrets.VPS_HOST }}'"
          echo "User: '${{ secrets.VPS_USER }}'"

      - name: Test rsync SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: README.md
          remote_path: /tmp/test-deploy/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
