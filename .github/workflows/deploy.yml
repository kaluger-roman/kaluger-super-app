name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'kaluger-roman/kaluger-super-app' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/production-build.yml
    permissions:
      contents: read

  deploy:
    name: Deploy on home
    needs: build
    if: github.repository == 'kaluger-roman/kaluger-super-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://tutor.kaluger.ru
    env:
      PRODUCTION_URL: https://tutor.kaluger.ru
    steps:
      - name: Verify the deployed app and landing revision
        run: |
          set -euo pipefail
          for ((attempt=1; attempt<=135; attempt++)); do
            if active=$(curl -fsS --max-time 8 "$PRODUCTION_URL/.well-known/kaluger-production-revision" 2>/dev/null) &&
               [[ "$active" == "$GITHUB_SHA" ]] &&
               curl -fsS --max-time 8 "$PRODUCTION_URL/health" >/dev/null &&
               curl -fsS --max-time 8 https://teacher.kaluger.ru/ >/dev/null; then
              printf 'Revision %s is live on home\n' "$active"
              exit 0
            fi
            sleep 10
          done
          echo 'Home did not confirm the requested deployment' >&2
          exit 1
