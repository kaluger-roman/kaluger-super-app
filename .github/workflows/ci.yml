name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Require committed release notes before publication
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          args=(--base "$PR_BASE_SHA" --head "$PR_HEAD_SHA")
          if [ "$PR_IS_DRAFT" = true ]; then args+=(--allow-empty-draft); fi
          node scripts/changelog-gate.mjs "${args[@]}"

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      landing: ${{ steps.filter.outputs.landing }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.prettierrc'
            backend:
              - 'backend/**'
              - '.prettierrc'
            landing:
              - 'landing/**'
            scripts:
              - 'scripts/**'
              - '.githooks/**'
              - '.codex/hooks.json'
              - '.github/workflows/ci.yml'
              - '.specify/scripts/**'
              - 'docker-compose*.yml'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Format check
        run: cd frontend && npm run format:check

      - name: Type check
        run: cd frontend && npx tsc --noEmit

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Vite optimizer
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/vitest.config.ts') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Tests (shard ${{ matrix.shard }}/3)
        run: cd frontend && npx vitest --run --reporter=blob --shard=${{ matrix.shard }}/3 --maxWorkers=2

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  frontend-tests-merge:
    needs: frontend-tests
    if: always() && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: frontend/.vitest-reports
          pattern: vitest-blob-*
          merge-multiple: true

      - name: Merge reports
        run: cd frontend && npx vitest --merge-reports

  backend-typecheck:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Lint
        run: cd backend && npm run lint

      - name: Format check
        run: cd backend && npm run format:check

      - name: Cache Prisma generated client
        uses: actions/cache@v4
        with:
          path: |
            backend/node_modules/.prisma
            backend/node_modules/@prisma/client
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Prisma generate
        run: cd backend && npx prisma generate

      - name: Type check
        run: cd backend && npm run build

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: tutor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d tutor_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/tutor_test
      JWT_SECRET: ci-test-secret
      PORT: 3001
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000
      RESEND_API_KEY: re_dummy_ci_key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Cache Prisma generated client
        uses: actions/cache@v4
        with:
          path: |
            backend/node_modules/.prisma
            backend/node_modules/@prisma/client
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Prisma generate
        run: cd backend && npx prisma generate

      - name: Run migrations
        run: cd backend && npx prisma migrate deploy

      - name: Tests (shard ${{ matrix.shard }}/2)
        run: cd backend && npx jest --shard=${{ matrix.shard }}/2

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: cd landing && npm ci

      - name: Lint
        run: cd landing && npm run lint

      - name: Type check
        run: cd landing && npx tsc --noEmit

      - name: Tests
        run: cd landing && npm test

      - name: Build
        run: cd landing && npm run build

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm run test:scripts
