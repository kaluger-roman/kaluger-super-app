# Only the local Docker gateway is trusted to forward proxy metadata.
map "$realip_remote_addr:$http_x_forwarded_proto" $upstream_scheme {
    "${TRUSTED_PROXY_IP}:https" https;
    default $scheme;
}

map $uri $logged_uri {
    ~^/api/student-invitations/validate/ /api/student-invitations/validate/[redacted];
    default $uri;
}

log_format production '$remote_addr [$time_local] "$request_method $logged_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log production;
    set_real_ip_from ${TRUSTED_PROXY_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /health {
        proxy_pass http://backend:3001/health;
    }

    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace untrusted incoming headers: Express trusts exactly this nginx hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_set_header Referer "";
    }

    location /ws {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
