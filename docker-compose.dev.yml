# Per-branch dev database for parallel branch/worktree development.
# Always launched via scripts/dev-stack.sh, which sets the project name
# (`-p dev-<branch>`) and exports DEV_DB_PORT. Only Postgres runs in Docker —
# dev servers stay on the host (fast HMR) on per-branch ports.
# The init script creates the second database (tutor_app_test) on first boot.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tutor_app
    ports:
      - "${DEV_DB_PORT:?set by scripts/dev-stack.sh}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/dev-db-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tutor_app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
